baseurl = "https://www.anirudhsshirahati.com/"
title = "Anirudh S Shirahati"
theme = "hugo-coder"
languagecode = "en"
defaultcontentlanguage = "en"
enableEmoji = false

# Exclude the theme's bundled demo content from the build
ignoreFiles = ['themes/hugo-coder/content']

# Disable taxonomy, term, and RSS pages (no blog on this site)
disableKinds = ["taxonomy", "term", "RSS"]

# Keep series defined so theme templates don't crash if any demo content slips through
[taxonomies]
  series = "series"

[markup]
  [markup.highlight]
  noClasses = false

  [markup.goldmark.renderer]
  unsafe = true

[params]
  author = "Anirudh S Shirahati"
  info = [
    "Senior Software Engineer",
    "Applied AI and LLM Application Engineering",
    "Python · FastAPI · RAG · LangChain · Docker · Azure · GCP",
    "Illinois, USA"
  ]
  description = "Senior Software Engineer with 6+ years of experience building Python based backend systems, REST APIs, and cloud native applications. Focused on Applied AI and LLM application engineering, building AI powered software with RAG, agent workflows, structured outputs, and local model inference, deployed on Azure and GCP."
  keywords = "Senior Software Engineer, AI Engineer, LLM Application Development, Applied AI, Retrieval Augmented Generation, RAG, AI Agents, Prompt Engineering, LangChain, LiteLLM, Hugging Face Transformers, Vector Stores, Chroma, Structured Outputs, JSON Schema, Model Quantization, Llama 3.1, Claude, OpenRouter, Python Developer, Backend Engineer, REST APIs, FastAPI, Flask, Pydantic, SQL, MySQL, MongoDB, Pandas, NumPy, Azure, GCP, Google Cloud Platform, Docker, CI/CD, GitHub Actions, Azure DevOps, Next.js, Vue.js, Full Stack Developer, Cloud Native Development, Illinois, USA"
  # Temporary placeholder in place of a photo
  avatarurl = "images/avatar-placeholder.png"

  faviconSVG = "/images/logos/favicon.svg"
  favicon_32 = "/images/logos/favicon-32x32.png"
  favicon_16 = "/images/logos/favicon-16x16.png"
  touchicon = "/images/logos/apple-touch-icon.png"
  mask_icon = "/images/logos/safari-pinned-tab.svg"
  mask_icon_color = "#1a7a4a"
  manifest = "/site.webmanifest"

  since = 2026
  enableTwemoji = false
  colorScheme = "light"
  hidecolorschemetoggle = true

  customSCSS = ["scss/custom.scss"]

